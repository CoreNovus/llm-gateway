[project]
name = "llm-gateway"
version = "0.1.0"
description = "OpenAI-compatible API gateway in front of self-hosted vLLM."
authors = [{ name = "CoreNovus contributors" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dynamic = ["dependencies"]
keywords = ["vllm", "llm", "gateway", "openai-compatible", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/CoreNovus/llm-gateway"
Repository = "https://github.com/CoreNovus/llm-gateway"
Issues = "https://github.com/CoreNovus/llm-gateway/issues"

[tool.poetry]
packages = [{ include = "llm_gateway" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = ">=0.121.3,<0.122.0"  # <0.122 avoids the HTTP 403 -> 401 change in fastapi.security; bumped from 0.115 to enable starlette 0.49+.
# starlette: directly pinned to close GHSA-7f5h-v6xp-fcq8 (O(n^2) DoS via Range header merging in FileResponse)
# and GHSA-2c2j-9gv5-cj73 (DoS via large multipart files).
starlette = "^0.49.1"
uvicorn = { extras = ["standard"], version = "^0.32.0" }
pydantic = "^2.9.0"
pydantic-settings = "^2.6.0"
httpx = "^0.27.0"
prometheus-client = "^0.21.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
# pytest-asyncio >=1.0 required for pytest 9 compat: pytest 9's `Package` collector ABI change crashes
# pytest_asyncio.plugin.pytest_collectstart in 0.23.x. Bumped together with the starlette security fix
# because test collection is otherwise broken on this repo.
pytest-asyncio = "^1.3.0"
respx = "^0.21.0"
ruff = "^0.7.0"
black = "^26.3.1"
pyright = "^1.1.380"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pyright]
include = ["llm_gateway"]
typeCheckingMode = "basic"
pythonVersion = "3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
